name: discord-news
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (GitHub may delay runs a few minutes)
  workflow_dispatch:          # "Run workflow" button for manual tests

permissions:
  contents: write             # to save seen.json back to the repo

concurrency: discord-news

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser==6.0.11 requests==2.32.3
      - run: python news.py
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}   # new channels need only a new secret, no edit here
      - name: Save seen.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen items" && git push)
